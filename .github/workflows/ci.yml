name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # ubuntu-latest 는 Ubuntu 26 으로 전환 중이라 Playwright 시스템 의존성 설치가 깨질 수 있어 고정한다.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mysterytalk
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: mysterytalk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mysterytalk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI 전용 임시 DB(외부에 노출되지 않는 서비스 컨테이너). 실제 비밀값이 아니다.
      DATABASE_URL: postgresql://mysterytalk:ci_only_password@localhost:5432/mysterytalk
      DATABASE_URL_TEST: postgresql://mysterytalk:ci_only_password@localhost:5432/mysterytalk_test
      DATABASE_URL_BROWSER: postgresql://mysterytalk:ci_only_password@localhost:5432/mysterytalk_browser_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 11.0.0 은 NestJS 12 템플릿 의존성 설치 중 내부 오류가 나서 npm 12 를 사용한다.
      - run: npm install -g npm@12.2.2
      - run: npm ci
      - run: npm run build:shared
      # 타입 기반 린트가 Prisma 생성 타입을 볼 수 있게 먼저 생성한다.
      - run: npm run prisma:generate -w backend
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build -w frontend
      # 브라우저 E2E(Playwright, AI는 Mock). 실패 시 추적 파일을 올린다.
      # 브라우저 다운로드는 일시 오류에 대비해 최대 3번 시도한다.
      - run: |
          for i in 1 2 3; do
            npx playwright install chromium && exit 0
            echo "playwright install failed (attempt $i), retrying..."
            sleep 10
          done
          exit 1
      # 시스템 패키지(apt) 설치는 외부 저장소 오류로 실패할 수 있다. 실행 환경에 대부분 이미 있으므로 실패해도 계속한다.
      - run: npx playwright install-deps chromium
        continue-on-error: true
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
