# 로컬 개발용 PostgreSQL. 값은 루트 .env 에서 읽는다(.env.example 참고).
services:
  db:
    image: postgres:17-alpine
    container_name: mysterytalk-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mysterytalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mysterytalk}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mysterytalk}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
